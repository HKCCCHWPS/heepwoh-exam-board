<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>學段評估電子看板</title>
<style>
  :root{
    --cream:#FDF6E9; --ink:#3B3733; --pink:#F7A8B8; --pink-soft:#FDE2E7;
    --red:#E8543F; --green:#6FBF73; --blue:#A9D8F2; --yellow:#FFF0B3;
    --card:#FFFFFF; --line:#3B3733;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--cream);
    background-image:radial-gradient(#E9DFC8 1.1px, transparent 1.1px);
    background-size:22px 22px;
    color:var(--ink);
    font-family:"華康中圓體","華康粗圓","DFKai-SB","標楷體","Microsoft JhengHei","微軟正黑體",system-ui,sans-serif;
    font-weight:700;
    overflow-x:hidden;
  }
  .wrap{max-width:1750px;margin:0 auto;padding:1.3vmin 2vmin .8vmin;height:100vh;display:flex;flex-direction:column;gap:.4vmin;overflow:hidden}
  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:1.4vmin;flex-wrap:wrap}
  .ttlwrap{display:flex;flex-direction:column;gap:.2vmin}
  .school{font-size:clamp(15px,2.9vmin,40px);color:#C8102E;letter-spacing:.12em;font-weight:900;-webkit-text-stroke:.4px #C8102E}
  .ttl{display:flex;align-items:center;gap:1vmin;font-size:clamp(20px,3.1vmin,38px);letter-spacing:.04em;white-space:nowrap}
  .ttl .hl{background:linear-gradient(transparent 58%,var(--yellow) 58%,var(--yellow) 92%,transparent 92%);padding:0 .3em}
  .datebox{margin-left:auto;text-align:right;font-size:clamp(13px,1.75vmin,22px);color:#7A7267;letter-spacing:.05em}
  .clock{font-size:clamp(30px,6.4vmin,88px);font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1}
  /* ---------- main grid ---------- */
  main{display:grid;grid-template-columns:1.62fr 1fr;gap:2vmin;margin-top:1.4vmin;align-items:stretch;flex:1;min-height:0}
  main>section.card{display:flex;flex-direction:column}
  .card{background:var(--card);border:3px solid var(--line);border-radius:26px;position:relative;padding:2.4vmin 2.6vmin}
  .badge{position:absolute;top:-1.5vmin;left:2.4vmin;background:var(--pink);color:#fff;border:2px solid var(--line);
         border-radius:999px;padding:.3vmin 1.6vmin;font-size:clamp(12px,1.6vmin,19px);letter-spacing:.06em}
  .badge.green{background:var(--green)}
  /* exam card */
  #examCard{display:flex;flex-direction:column;justify-content:space-evenly;min-height:0;padding-top:4.4vmin;padding-bottom:3.2vmin}
  .subjectline{display:flex;align-items:center;gap:2vmin;flex-wrap:wrap}
  .subj{font-size:clamp(44px,15vmin,210px);line-height:1.02;letter-spacing:.06em}
  .range{font-size:clamp(15px,2.2vmin,26px);background:#fff;border:2px solid var(--line);border-radius:999px;
         padding:.5vmin 2vmin;letter-spacing:.06em;white-space:nowrap;font-variant-numeric:tabular-nums}
  .meta{display:flex;flex-direction:column;gap:.9vmin;align-items:flex-start}
  .dur{font-size:clamp(13px,2.1vmin,26px);background:var(--yellow);border:2px solid var(--line);border-radius:999px;
        padding:.5vmin 2vmin;letter-spacing:.06em;white-space:nowrap}
  .countline{display:flex;align-items:baseline;gap:2vmin;flex-wrap:wrap;margin-top:1.4vmin}
  .countlabel{font-size:clamp(14px,2.1vmin,25px);letter-spacing:.05em;color:#4A443C}
  .count{font-size:clamp(34px,10.4vmin,150px);color:var(--red);font-variant-numeric:tabular-nums;line-height:1}
  /* progress */
  .barwrap{margin-top:2.2vmin}
  .bar{position:relative;height:clamp(20px,3.8vmin,52px);border-radius:999px;background:#F0EAD9;border:2px solid var(--line);overflow:visible}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px 0 0 999px;
        background:repeating-linear-gradient(135deg,#F79DAE 0 14px,#F8B8C4 14px 28px);
        border:2px solid var(--line);border-left:none;transition:width .45s linear}
  .mascot{position:absolute;top:50%;transform:translate(-50%,-58%);font-size:clamp(20px,3.6vmin,44px);
          transition:left .45s linear;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15));animation:bob 1.1s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translate(-50%,-58%)}50%{transform:translate(-50%,-70%)}}
  .flag{position:absolute;right:-1.2vmin;top:50%;transform:translateY(-70%);font-size:clamp(18px,3vmin,34px)}
  .barmeta{display:flex;justify-content:space-between;margin-top:1.4vmin;font-size:clamp(12px,1.6vmin,19px);color:#7A7267;font-variant-numeric:tabular-nums}
  /* attendance */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:1.6vmin}
  .stat{border:2px solid var(--line);border-radius:18px;padding:1.4vmin 1vmin;text-align:center;background:var(--blue)}
  .stat.g{background:#CBEECB}
  .stat .k{font-size:clamp(12px,1.7vmin,20px);letter-spacing:.08em}
  .stat .v{font-size:clamp(30px,7.2vmin,92px);line-height:1.05;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:.38em;margin-left:.15em}
  .absentbox{margin-top:1.6vmin;background:var(--pink-soft);border:2px solid var(--line);border-radius:18px;
             padding:1.4vmin;min-height:10vmin;flex:1;display:flex;flex-direction:column}
  .absentbox .chips{overflow:auto}
  .absenthead{display:flex;justify-content:space-between;align-items:center;font-size:clamp(12px,1.7vmin,20px);letter-spacing:.06em;margin-bottom:1vmin;color:#6B5B60}
  .chips{display:flex;flex-wrap:wrap;gap:1vmin}
  .chip{display:inline-flex;align-items:center;gap:.6vmin;background:#fff;border:2px solid var(--line);border-radius:999px;
        padding:.6vmin 1.8vmin;font-size:clamp(14px,2.4vmin,30px)}
  .chip .no{color:#4A443C}
  .chip .rs{color:#B4566B}
  .empty{font-size:clamp(12px,1.7vmin,20px);color:#9A8F94;letter-spacing:.05em}
  /* ---- subject strip ---- */
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1.6vmin;margin-top:1.8vmin;flex:none;max-height:22vmin;overflow:auto}
  .scard{background:#fff;border:3px solid var(--line);border-radius:20px;padding:1.2vmin 1.6vmin;display:flex;
         align-items:center;justify-content:space-between;gap:1vmin;opacity:.55;transition:.25s}
  .scard .nm{font-size:clamp(15px,2.3vmin,28px);letter-spacing:.06em}
  .scard .tm{font-size:clamp(11px,1.5vmin,17px);color:#7A7267;font-variant-numeric:tabular-nums}
  .pill{border:2px solid var(--line);border-radius:999px;padding:.35vmin 1.4vmin;font-size:clamp(11px,1.5vmin,18px);white-space:nowrap}
  .scard.now{opacity:1;background:var(--yellow);transform:translateY(-2px);box-shadow:0 4px 0 rgba(0,0,0,.12)}
  .scard.now .pill{background:var(--pink);color:#fff}
  .scard.done{opacity:.9;background:#F1F1EC}
  .scard.done .pill{background:#D8D8CF}
  /* footer */
  .tip{text-align:center;margin:1.6vmin 0 .6vmin;font-size:clamp(12px,1.9vmin,22px);letter-spacing:.06em;color:#6B6257}
  .toolbar{display:flex;justify-content:center;align-items:center;gap:1.2vmin;flex-wrap:wrap;padding-bottom:1.2vmin;position:relative}
  .toolbar .credit{position:absolute;right:0;bottom:.4vmin}
  .btn{background:#fff;border:2px solid var(--line);border-radius:999px;padding:.6vmin 1.8vmin;font:inherit;
       font-size:clamp(11px,1.6vmin,19px);cursor:pointer;letter-spacing:.05em;color:var(--ink)}
  .btn:active{transform:translateY(1px)}
  .btn.pri{background:var(--yellow)}
  .credit{font-size:clamp(9px,1.25vmin,14px);color:#B3A99C;letter-spacing:.06em;white-space:nowrap}
  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(59,55,51,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:3vmin}
  .overlay.on{display:flex}
  .modal{background:#fff;border:3px solid var(--line);border-radius:28px;box-shadow:0 18px 0 rgba(0,0,0,.12);
         max-width:min(1000px,94vw);max-height:92vh;overflow:auto;padding:3vmin}
  .modal.timeup{text-align:center;padding:4vmin 7vmin;cursor:pointer}
  .modal.timeup .bell{font-size:clamp(40px,9vmin,90px)}
  .modal.timeup h2{margin:.5vmin 0;font-size:clamp(26px,6.4vmin,72px);letter-spacing:.06em}
  .modal.timeup p{margin:.4vmin 0;font-size:clamp(14px,2.4vmin,30px);color:#5E564D;letter-spacing:.04em}
  .modal.timeup .hint{font-size:clamp(11px,1.5vmin,17px);color:#A79C90;margin-top:1.6vmin}
  h3{margin:0 0 1.2vmin;font-size:clamp(17px,2.4vmin,26px);letter-spacing:.06em}
  .sect{border:2px dashed #D9CFC0;border-radius:18px;padding:1.8vmin;margin-bottom:1.8vmin}
  .sect h4{margin:0 0 1.2vmin;font-size:clamp(14px,1.9vmin,21px);color:#8A7F72;letter-spacing:.06em}
  .row{display:flex;gap:1.2vmin;flex-wrap:wrap;align-items:center;margin-bottom:1vmin}
  label{font-size:clamp(12px,1.6vmin,18px);letter-spacing:.04em;color:#5E564D}
  input[type=text],input[type=time],input[type=number],select{
     font:inherit;font-size:clamp(13px,1.7vmin,19px);padding:.6vmin 1vmin;border:2px solid var(--line);
     border-radius:10px;background:#FFFDF7;color:var(--ink);min-width:0}
  input[type=text]{width:11ch}
  input[type=number]{width:7ch}
  .quick{display:flex;gap:.7vmin;flex-wrap:wrap;margin-top:.6vmin}
  .qbtn{background:#F6F1E4;border:1.5px solid #C9BFAE;border-radius:999px;padding:.3vmin 1.1vmin;
        font:inherit;font-size:clamp(11px,1.45vmin,16px);cursor:pointer;color:#5E564D}
  .qbtn:hover{background:var(--yellow)}
  .del{background:#fff;border:1.5px solid #D9A0A8;color:#B4566B;border-radius:8px;padding:.3vmin .9vmin;cursor:pointer;font:inherit;font-size:clamp(11px,1.4vmin,15px)}
  .endrow{display:flex;justify-content:flex-end;align-items:center;gap:1.2vmin;margin-top:1vmin;position:sticky;bottom:-3vmin;background:#fff;padding:1.4vmin 0 .6vmin;border-top:1px solid #EFE7D8}
  .msg{font-size:clamp(12px,1.6vmin,18px);color:#6FBF73;min-height:1.4em}
  /* warning toast */
  .toast{position:fixed;left:50%;top:3vmin;transform:translate(-50%,-260%);opacity:0;pointer-events:none;background:#fff;border:3px solid var(--line);
         border-radius:999px;padding:1.2vmin 3vmin;font-size:clamp(14px,2.4vmin,30px);letter-spacing:.05em;
         box-shadow:0 8px 0 rgba(0,0,0,.1);transition:transform .35s,opacity .35s;z-index:70}
  .toast.on{transform:translate(-50%,0);opacity:1}
  @media (max-width:640px){
    #subjSects .srow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.7vmin 1vmin;align-items:center}
    #subjSects .srow > label:first-child{grid-column:1 / -1}
    #subjSects .srow > .sName{grid-column:1 / -1;width:100%}
    #subjSects .srow > .sDel{grid-column:1 / -1;justify-self:start}
    #subjSects .srow > input[type=time]{width:100%;min-width:0}
    .modal{padding:3vmin 2.2vmin;overflow-x:hidden}
    input[type=text]{width:100%;max-width:100%}
    input[type=number]{width:6ch}
  }
  @media (max-width:900px){
    main{grid-template-columns:1fr}
    .strip{grid-template-columns:1fr;max-height:none;overflow:visible}
    #examCard{min-height:auto}
  }
  @media (max-width:700px){
    html,body{overflow-x:hidden;height:auto;max-width:100%}
    .card{overflow:hidden}
    .two{gap:2vw}
    .stat .v{font-size:10vw}
    .stat .k{font-size:3.2vw}
    .subj{font-size:12.5vw;word-break:break-all}
    .count{font-size:10.5vw}
    .badge{font-size:3.2vw;padding:.8vw 3vw}
    .barmeta{font-size:3vw}
    .absenthead{font-size:3.2vw}
    .wrap{height:auto;padding:2.4vw 3vw;gap:1.6vw}
    header{gap:2vw}
    .ttl{font-size:5.2vw;white-space:normal}
    .datebox{margin-left:0;order:3;width:100%;text-align:left;font-size:3.4vw}
    .clock{font-size:10.5vw;margin-left:auto}
    .card{padding:4.4vw 4vw;border-radius:6vw}
    .subj{font-size:15.5vw}
    .count{font-size:13.5vw}
    .countlabel{font-size:3.6vw}
    .stat .v{font-size:11vw}
    .chip{font-size:3.4vw}
    .scard .nm{font-size:4.2vw}
    .tip{font-size:3.4vw}
    .btn{font-size:3.4vw;padding:1.4vw 4vw}
    .credit{position:static!important;font-size:2.8vw}
    .overlay{padding:3vw}
    .modal{width:100%;max-width:100%;padding:4vw 3.6vw;border-radius:5vw}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ttlwrap">
      <div class="school" id="schoolLine">中華基督教會協和小學</div>
      <div class="ttl"><span style="font-size:1.1em">📋</span><span class="hl" id="boardTitle">學段評估</span></div>
    </div>
    <div class="datebox" id="dateBox">—</div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <main>
    <section class="card" id="examCard">
      <div class="badge" id="idxBadge">第 1 科 / 共 3 科</div>
      <div class="subjectline">
        <div class="subj" id="subjName">—</div>
        <div class="meta">
          <div class="range" id="subjRange">--:-- – --:--</div>
          <div class="dur" id="subjDur">時限：—</div>
        </div>
      </div>
      <div class="countline">
        <div class="countlabel" id="countLabel">距離評估結束還有</div>
        <div class="count" id="countVal">--:--</div>
      </div>
      <div class="barwrap">
        <div class="bar">
          <div class="fill" id="fill" style="width:0%"></div>
          <div class="mascot" id="mascot" style="left:2%">🐤</div>
          <div class="flag">🚩</div>
        </div>
        <div class="barmeta"><span id="barStart">--:--</span><span id="barPct">0%</span><span id="barEnd">--:--</span></div>
      </div>
    </section>

    <section class="card">
      <div class="badge green">出 缺 席</div>
      <div style="height:1.8vmin"></div>
      <div class="two">
        <div class="stat"><div class="k">應 到</div><div class="v" id="statExp">0<small>人</small></div></div>
        <div class="stat g"><div class="k">實 到</div><div class="v" id="statAct">0<small>人</small></div></div>
      </div>
      <div class="absentbox">
        <div class="absenthead"><span>缺席學號</span><span id="absentCount">共 0 人</span></div>
        <div class="chips" id="absentChips"><span class="empty">全部到齊 👍</span></div>
        <div id="rateLine" style="margin-top:auto;text-align:right;font-size:clamp(11px,1.7vmin,22px);color:#9A8F94;letter-spacing:.06em"></div>
      </div>
      <div style="margin-top:1.4vmin;font-size:clamp(11px,1.5vmin,17px);color:#8A7F72;letter-spacing:.04em" id="classLine">班別：—</div>
    </section>
  </main>

  <div class="strip" id="strip"></div>

  <div class="tip" id="tipLine">✏️ 作答完記得檢查姓名及學號 ✏️</div>

  <div class="toolbar">
    <button class="btn" id="btnSet">⚙️ 設定</button>
    <button class="btn" id="btnSound">🔔 測試叮咚</button>
    <button class="btn" id="btnFull">⛶ 全螢幕</button>
    <span class="credit" id="credit">26-27 數字教育及創新科技主任製作</span>
  </div>
</div>

<div class="toast" id="toast">⏰ 尚有 5 分鐘</div>

<div class="overlay" id="timeupOverlay">
  <div class="modal timeup" id="timeupBox">
    <div class="bell">🔔</div>
    <h2 id="tuTitle">中文 時間到！</h2>
    <p>請停筆，將試卷反轉放在桌面 ✋</p>
    <div class="hint">點一下繼續</div>
  </div>
</div>

<div class="overlay" id="setOverlay">
  <div class="modal">
    <h3>⚙️ 看板設定</h3>

    <div class="sect">
      <div class="row">
        <label>學校名</label><input type="text" id="fSchool" style="width:20ch">
        <label>看板標題</label><input type="text" id="fTitle" style="width:12ch">
        <label>班別</label><input type="text" id="fClass" style="width:7ch">
        <label>底部提示</label><input type="text" id="fTip" style="width:100%;max-width:100%;margin-top:.4vmin">
      </div>
      <div class="row">
        <label>小主角</label>
        <select id="fMascot">
          <option value="🐤">🐤 小雞</option>
          <option value="🦌">🦌 小鹿</option>
          <option value="🐰">🐰 兔仔</option>
          <option value="🚀">🚀 火箭</option>
          <option value="🐳">🐳 鯨魚</option>
        </select>
        <label>結束前提醒</label>
        <input type="number" id="fWarnM" min="0" max="60" step="1"> 分
        <input type="number" id="fWarnS" min="0" max="59" step="1"> 秒
        <span style="font-size:clamp(11px,1.4vmin,16px);color:#9A8F94">（0分0秒＝唔提醒）</span>
      </div>
    </div>

    <div class="sect">
      <h4>評估科目（想幾多科都得，可加可刪）</h4>
      <div class="quick" id="presetRow" style="margin-bottom:1.2vmin"></div>
      <div id="subjSects"></div>
      <button class="qbtn" id="btnAddSubj" type="button" style="margin-top:.8vmin">＋ 加入科目</button>
      <div class="quick" id="chipRow" style="margin-top:1.2vmin">
        <span style="font-size:clamp(11px,1.45vmin,16px);color:#9A8F94;letter-spacing:.04em">先點一下科目格，再點下面：</span>
      </div>
    </div>

    <div class="sect">
      <h4>出缺席</h4>
      <div class="row">
        <label>應到人數</label><input type="number" id="fExp" min="0" max="99">
        <label>實到人數</label><input type="text" id="fAct" readonly style="width:7ch;background:#EFEFE9;text-align:center">
        <span style="font-size:clamp(11px,1.4vmin,16px);color:#9A8F94">自動計算</span>
      </div>
      <div id="absentRows"></div>
      <button class="qbtn" id="btnAddAbsent" style="margin-top:.6vmin">＋ 加入缺席學號</button>
    </div>

    <div class="endrow">
      <span class="msg" id="saveMsg"></span>
      <button class="btn" id="btnCancel">取消</button>
      <button class="btn pri" id="btnSave">儲存</button>
    </div>
  </div>
</div>

<script>
"use strict";
const LSKEY = "hwps_exam_board_v1";
const REASONS = ["病假","事假","公假","遲到","早退","其他"];
const QUICK = ["中文聆聽","中文閱讀","中文寫作","中文說話","英文聆聽","英文閱讀","英文寫作","英文說話",
  "數學","常識","科學","人文","普通話","聖經","音樂","視藝","體育","體評","創新科技","温習","說評","學習活動"];
const PRESETS = {
  "11/12": [["中文閱讀","08:30","09:40"],["英文聆聽","09:55","10:35"],["温習／說話評估","10:50","12:00"]],
  "11/13": [["英文","08:30","09:40"],["中文聆聽","09:55","10:35"],["中文寫作","10:50","12:00"]],
  "11/16": [["數學","08:30","09:40"],["温習","09:55","10:35"],["科學","10:50","12:00"]],
  "11/17": [["常識","08:30","09:40"],["聖經","09:55","10:35"],["學習活動／體評","10:50","12:00"]]
};

const DEFAULT = {
  school: "中華基督教會協和小學",
  title: "學段評估",
  klass: "",
  tip: "✏️ 作答完記得檢查姓名及學號 ✏️",
  mascot: "🐤",
  warnM: 5,
  warnS: 0,
  expected: 28,
  absent: [],
  subjects: [
    { name: "中文閱讀", start: "08:30", end: "09:40" },
    { name: "英文聆聽", start: "09:55", end: "10:35" },
    { name: "温習／說話評估", start: "10:50", end: "12:00" }
  ]
};

let cfg = load();
function load() {
  try {
    const raw = localStorage.getItem(LSKEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT));
    const o = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(DEFAULT)), o);
  } catch (e) { return JSON.parse(JSON.stringify(DEFAULT)); }
}
function save() { try { localStorage.setItem(LSKEY, JSON.stringify(cfg)); } catch (e) {} }

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2, "0");
function hms2sec(t) {
  if (!t || t.indexOf(":") < 0) return null;
  const p = t.split(":").map(Number);
  return (p[0] || 0) * 3600 + (p[1] || 0) * 60 + (p[2] || 0);
}
function sec2clock(s) {
  s = Math.max(0, Math.round(s));
  return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60);
}
function sec2ms(s) {
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s / 60), ss = s % 60;
  return pad(m) + ":" + pad(ss);
}
function fmtDur(a, b) {
  const s = hm2sec(b) - hm2sec(a);
  if (!(s > 0)) return "時限：—";
  const m = Math.round(s / 60);
  if (m >= 60) {
    const hh = Math.floor(m / 60), mm = m % 60;
    return "時限：" + hh + " 小時" + (mm ? " " + mm + " 分" : "");
  }
  return "時限：" + m + " 分鐘";
}
function fmtRemain(s) {
  s = Math.max(0, Math.round(s));
  if (s >= 3600) return Math.floor(s / 3600) + ":" + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60);
  return pad(Math.floor(s / 60)) + ":" + pad(s % 60);
}
function hm2sec(hhmm) { const p = (hhmm || "").split(":").map(Number); return (p[0]||0)*3600 + (p[1]||0)*60; }

/* ---------- audio ---------- */
let AC = null;
function ac() {
  if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(freq, at, dur, vol) {
  const c = ac(); if (!c) return;
  const t0 = c.currentTime + at;
  const o = c.createOscillator(), g = c.createGain();
  o.type = "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function ding() { tone(1174.7, 0, 0.45, 0.16); tone(1568, 0, 0.35, 0.08); }
function dingdong() { tone(880, 0, 0.6, 0.26); tone(659.3, 0.34, 1.3, 0.26); tone(440, 0.34, 1.3, 0.1); }

/* ---------- state ---------- */
let fired = {};                 // key -> true
let modalShownFor = null;
let curIdx = -1;

function subs() {
  return (cfg.subjects || [])
    .filter(s => s && s.name && s.start && s.end)
    .slice()
    .sort((a, b) => hm2sec(a.start) - hm2sec(b.start));
}

function compute() {
  const now = new Date();
  const nowS = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() / 1000;
  const list = subs();
  const out = { list: list, nowS: nowS, mode: "none", idx: -1, prog: 0, remain: 0, next: null, prev: null };
  if (!list.length) return out;
  for (let i = 0; i < list.length; i++) {
    const s = hm2sec(list[i].start), e = hm2sec(list[i].end);
    if (nowS >= s && nowS < e) {
      out.mode = "exam"; out.idx = i;
      out.remain = e - nowS;
      out.prog = Math.min(1, Math.max(0, (nowS - s) / Math.max(1, e - s)));
      out.prev = i > 0 ? list[i - 1] : null;
      out.next = i + 1 < list.length ? list[i + 1] : null;
      return out;
    }
  }
  // not in an exam
  for (let i = 0; i < list.length; i++) {
    const s = hm2sec(list[i].start);
    if (nowS < s) {
      out.mode = i === 0 ? "before" : "break";
      out.idx = i;
      out.next = list[i];
      out.remain = s - nowS;
      out.prev = i > 0 ? list[i - 1] : null;
      return out;
    }
  }
  out.mode = "done";
  out.idx = list.length;
  out.prev = list[list.length - 1];
  return out;
}

/* ---------- render ---------- */
const $ = id => document.getElementById(id);

function renderChrome() {
  const d = new Date();
  const wd = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"][d.getDay()];
  $("dateBox").textContent = (d.getMonth() + 1) + " 月 " + d.getDate() + " 日　" + wd;
  $("clock").textContent = sec2clock(d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds());
  $("boardTitle").textContent = cfg.title || "學段評估";
  $("schoolLine").textContent = cfg.school || "";
  $("tipLine").textContent = cfg.tip || "";
  $("mascot").textContent = cfg.mascot || "🐤";
  $("classLine").textContent = "班別：" + (cfg.klass || "—");
  renderAttendance();
}

function renderAttendance() {
  const exp = Number(cfg.expected) || 0;
  const abs = (cfg.absent || []).filter(a => a && String(a.no).trim() !== "");
  const act = Math.max(0, exp - abs.length);
  $("statExp").innerHTML = exp + "<small>人</small>";
  $("statAct").innerHTML = act + "<small>人</small>";
  $("absentCount").textContent = "共 " + abs.length + " 人";
  const rl = $("rateLine"); if (rl) rl.textContent = exp ? ("出席率 " + Math.round(act / exp * 1000) / 10 + "%") : "";
  const box = $("absentChips");
  if (!abs.length) { box.innerHTML = '<span class="empty">全部到齊 👍</span>'; return; }
  box.innerHTML = abs.map(a =>
    '<span class="chip"><span class="no">' + esc(a.no) + ' 號</span><span class="rs">' + esc(a.reason || "缺席") + "</span></span>"
  ).join("");
}

function renderStrip(st) {
  const strip = $("strip");
  const list = st.list;
  if (strip.dataset.n !== String(list.length) + JSON.stringify(list.map(s => s.name + s.start + s.end))) {
    strip.innerHTML = list.map((s, i) =>
      '<div class="scard" data-i="' + i + '"><div><div class="nm">' + esc(s.name) + '</div><div class="tm">' +
      esc(s.start) + " – " + esc(s.end) + '</div></div><span class="pill">待考</span></div>'
    ).join("");
    strip.dataset.n = String(list.length) + JSON.stringify(list.map(s => s.name + s.start + s.end));
  }
  const cards = strip.children;
  for (let i = 0; i < cards.length; i++) {
    const c = cards[i];
    c.className = "scard";
    const pill = c.querySelector(".pill");
    const s = list[i], nowS = st.nowS;
    if (nowS >= hm2sec(s.end)) { c.classList.add("done"); pill.textContent = "已完成"; }
    else if (nowS >= hm2sec(s.start)) { c.classList.add("now"); pill.textContent = "評估中"; }
    else pill.textContent = "待考";
  }
}

function tick() {
  const st = compute();
  renderChrome();

  const badge = $("idxBadge"), subj = $("subjName"), range = $("subjRange");
  const label = $("countLabel"), count = $("countVal");
  const fill = $("fill"), mascot = $("mascot");

  if (st.mode === "exam") {
    const s = st.list[st.idx];
    badge.textContent = "第 " + (st.idx + 1) + " 科 / 共 " + st.list.length + " 科";
    subj.textContent = s.name;
    range.textContent = s.start + " – " + s.end;
    $("subjDur").textContent = fmtDur(s.start, s.end);
    label.textContent = "距離評估結束還有";
    count.textContent = fmtRemain(st.remain);
    count.style.color = st.remain <= 60 ? "#D63325" : "var(--red)";
    fill.style.width = (st.prog * 100).toFixed(1) + "%";
    mascot.style.left = Math.min(97, Math.max(2, st.prog * 100)) + "%";
    $("barStart").textContent = s.start;
    $("barEnd").textContent = s.end;
    $("barPct").textContent = Math.round(st.prog * 100) + "%";
    curIdx = st.idx;
    watchSounds(st);
  } else if (st.mode === "break" || st.mode === "before") {
    const nx = st.next;
    badge.textContent = st.mode === "break" ? "小 息 時 段" : "評 估 未 開 始";
    subj.textContent = st.mode === "break" ? "小息中" : "準備";
    range.textContent = nx.start + " – " + nx.end;
    $("subjDur").textContent = fmtDur(nx.start, nx.end);
    label.textContent = "距離「" + nx.name + "」開始還有";
    count.textContent = fmtRemain(st.remain);
    count.style.color = "#6FBF73";
    fill.style.width = "0%";
    mascot.style.left = "2%";
    $("barStart").textContent = nx.start;
    $("barEnd").textContent = nx.end;
    $("barPct").textContent = "下一科：" + nx.name;
    curIdx = -1;
  } else if (st.mode === "done") {
    badge.textContent = "全 部 完 成";
    subj.textContent = "完成 🎉";
    range.textContent = "今日評估已結束";
    $("subjDur").textContent = "";
    label.textContent = "收拾好，多謝大家";
    count.textContent = "再見";
    count.style.color = "#6FBF73";
    fill.style.width = "100%";
    mascot.style.left = "97%";
    $("barStart").textContent = st.list.length ? st.list[0].start : "--:--";
    $("barEnd").textContent = st.list.length ? st.list[st.list.length - 1].end : "--:--";
    $("barPct").textContent = "100%";
    curIdx = -1;
  } else {
    badge.textContent = "未 設 定";
    subj.textContent = "請先設定";
    range.textContent = "--:-- – --:--";
    $("subjDur").textContent = "時限：—";
    label.textContent = "距離評估結束還有";
    count.textContent = "--:--";
    fill.style.width = "0%";
    mascot.style.left = "2%";
    $("barStart").textContent = "--:--";
    $("barEnd").textContent = "--:--";
    $("barPct").textContent = "0%";
    curIdx = -1;
  }
  renderStrip(st);
}

function watchSounds(st) {
  const key = st.idx + "|" + cfg.subjects[st.idx].start + "|" + cfg.subjects[st.idx].end;
  const warn = (Number(cfg.warnM) || 0) * 60 + (Number(cfg.warnS) || 0);
  if (warn > 0 && st.remain <= warn && !fired[key + "|w"]) {
    fired[key + "|w"] = true;
    ding();
    showToast("⏰ " + cfg.subjects[st.idx].name + " 尚有 " + fmtWarn(warn) + "，請準備交卷");
  }
  if (st.remain <= 0.6 && !fired[key + "|e"]) {
    fired[key + "|e"] = true;
    dingdong();
    showTimeup(cfg.subjects[st.idx].name);
  }
}
function fmtWarn(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m && s) return m + " 分 " + s + " 秒";
  if (m) return m + " 分鐘";
  return s + " 秒";
}
let toastTimer = null;
function showToast(txt) {
  const el = $("toast");
  el.textContent = txt;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 9000);
}
function showTimeup(name) {
  $("tuTitle").textContent = name + " 時間到！";
  $("timeupOverlay").classList.add("on");
  modalShownFor = name;
}

/* ---------- settings UI ---------- */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

let lastNameInput = null;

function buildQuickUI() {
  const pr = $("presetRow");
  pr.innerHTML = '<span style="font-size:clamp(11px,1.45vmin,16px);color:#9A8F94;letter-spacing:.04em">一鍵載入評估日：</span>' +
    Object.keys(PRESETS).map(d => '<button class="qbtn preset" type="button" data-d="' + d + '">' + d + "</button>").join("");
  pr.querySelectorAll(".preset").forEach(b => b.addEventListener("click", () => {
    collectSettings();
    cfg.subjects = PRESETS[b.dataset.d].map(r => ({ name: r[0], start: r[1], end: r[2] }));
    buildSubjSects();
  }));
  const cr = $("chipRow");
  cr.insertAdjacentHTML("beforeend", QUICK.map(q => '<button class="qbtn chipfill" type="button" data-n="' + q + '">' + q + "</button>").join(""));
  cr.querySelectorAll(".chipfill").forEach(b => b.addEventListener("click", () => {
    if (lastNameInput) { lastNameInput.value = b.dataset.n; lastNameInput.focus(); }
  }));
  const add = $("btnAddSubj");
  if (add) add.addEventListener("click", () => {
    collectSettings();
    cfg.subjects.push({ name: "", start: "", end: "" });
    buildSubjSects();
    const rows = document.querySelectorAll("#subjSects .srow .sName");
    if (rows.length) rows[rows.length - 1].focus();
  });
}

function buildSubjSects() {
  const host = $("subjSects");
  const arr = (cfg.subjects && cfg.subjects.length) ? cfg.subjects : [{ name: "", start: "", end: "" }];
  host.innerHTML = arr.map((s, i) =>
    '<div class="row srow" style="margin-bottom:.8vmin">' +
    '<label style="min-width:4.2ch">第 ' + (i + 1) + ' 科</label>' +
    '<input type="text" class="sName" value="' + esc(s.name) + '" style="width:14ch" placeholder="科目名稱">' +
    '<label>開始</label><input type="time" class="sStart" value="' + esc(s.start) + '">' +
    '<label>結束</label><input type="time" class="sEnd" value="' + esc(s.end) + '">' +
    (arr.length > 1 ? '<button class="del sDel" type="button">刪除</button>' : '') +
    "</div>"
  ).join("");
  host.querySelectorAll(".srow").forEach((row, i) => {
    row.querySelector(".sName").addEventListener("focus", e => { lastNameInput = e.target; });
    const del = row.querySelector(".sDel");
    if (del) del.addEventListener("click", () => {
      collectSettings();
      cfg.subjects.splice(i, 1);
      if (!cfg.subjects.length) cfg.subjects = [{ name: "", start: "", end: "" }];
      buildSubjSects();
    });
  });
}

function buildAbsentRows() {
  const host = $("absentRows");
  host.innerHTML = "";
  (cfg.absent || []).forEach((a, i) => {
    const row = document.createElement("div");
    row.className = "row aRow";
    row.innerHTML =
      '<label>學號</label><input type="text" class="aNo" value="' + esc(a.no) + '" style="width:5ch">' +
      '<label>原因</label><select class="aRs">' +
      REASONS.map(r => '<option' + (r === a.reason ? " selected" : "") + ">" + r + "</option>").join("") +
      "</select>" +
      '<button class="del" type="button">刪除</button>';
    host.appendChild(row);
    row.querySelector(".del").addEventListener("click", () => {
      cfg.absent.splice(i, 1);
      buildAbsentRows(); recalcAct();
    });
    row.querySelector(".aNo").addEventListener("input", recalcAct);
  });
  recalcAct();
}
function recalcAct() {
  const exp = Number($("fExp").value) || 0;
  const n = document.querySelectorAll("#absentRows .aRow .aNo").length
    ? Array.from(document.querySelectorAll("#absentRows .aRow .aNo")).filter(x => x.value.trim() !== "").length : 0;
  $("fAct").value = Math.max(0, exp - n);
}

function openSettings() {
  $("fSchool").value = cfg.school || "";
  $("fTitle").value = cfg.title || "";
  $("fClass").value = cfg.klass || "";
  $("fTip").value = cfg.tip || "";
  $("fMascot").value = cfg.mascot || "🐤";
  $("fWarnM").value = Number(cfg.warnM) || 0;
  $("fWarnS").value = Number(cfg.warnS) || 0;
  $("fExp").value = Number(cfg.expected) || 0;
  $("saveMsg").textContent = "";
  buildSubjSects();
  buildAbsentRows();
  $("setOverlay").classList.add("on");
  ac();
}

function collectSettings() {
  cfg.school = $("fSchool").value.trim();
  cfg.title = $("fTitle").value.trim() || "學段評估";
  cfg.klass = $("fClass").value.trim();
  cfg.tip = $("fTip").value.trim();
  cfg.mascot = $("fMascot").value;
  cfg.warnM = Number($("fWarnM").value) || 0;
  cfg.warnS = Number($("fWarnS").value) || 0;
  cfg.expected = Number($("fExp").value) || 0;
  const arr = [];
  document.querySelectorAll("#subjSects .srow").forEach(row => {
    const name = row.querySelector(".sName").value.trim();
    const start = row.querySelector(".sStart").value;
    const end = row.querySelector(".sEnd").value;
    if (name && start && end) arr.push({ name: name, start: start, end: end });
  });
  cfg.subjects = arr;
  const abs = [];
  document.querySelectorAll("#absentRows .aRow").forEach(r => {
    const no = r.querySelector(".aNo").value.trim();
    if (no) abs.push({ no: no, reason: r.querySelector(".aRs").value });
  });
  cfg.absent = abs;
}

/* ---------- wiring ---------- */
$("btnSet").addEventListener("click", openSettings);
$("btnCancel").addEventListener("click", () => $("setOverlay").classList.remove("on"));
$("btnSave").addEventListener("click", () => {
  collectSettings();
  if (!cfg.subjects.length) { $("saveMsg").style.color = "#D63325"; $("saveMsg").textContent = "請至少填一科（科目＋起訖時間）"; return; }
  save(); fired = {}; modalShownFor = null;
  $("saveMsg").style.color = "#6FBF73";
  $("saveMsg").textContent = "✅ 已儲存";
  setTimeout(() => $("setOverlay").classList.remove("on"), 450);
  tick();
});
$("btnAddAbsent").addEventListener("click", () => {
  collectSettings();
  cfg.absent.push({ no: "", reason: "病假" });
  buildAbsentRows();
  const rows = document.querySelectorAll("#absentRows .aRow .aNo");
  if (rows.length) rows[rows.length - 1].focus();
});
$("fExp").addEventListener("input", recalcAct);
$("btnSound").addEventListener("click", () => {
  ac(); dingdong();
  showToast("🔔 呢個就係時間到嘅叮～咚～");
});
$("btnFull").addEventListener("click", () => {
  const el = document.documentElement;
  if (!document.fullscreenElement) { (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el); }
  else { (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document); }
});
$("timeupOverlay").addEventListener("click", () => $("timeupOverlay").classList.remove("on"));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("setOverlay").classList.remove("on"); $("timeupOverlay").classList.remove("on"); }
});

/* prime so that already-past events do not fire on load */
(function prime() {
  const st = compute();
  subs().forEach((s, i) => {
    const k = i + "|" + s.start + "|" + s.end;
    if (st.nowS >= hm2sec(s.end)) { fired[k + "|e"] = true; fired[k + "|w"] = true; }
  });
})();

buildQuickUI();
tick();
setInterval(tick, 500);
document.addEventListener("click", () => { if (AC && AC.state === "suspended") AC.resume(); }, { once: true });
</script>
